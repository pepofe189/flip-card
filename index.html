<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flip Card Tilt</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{
  display:flex;align-items:center;justify-content:center;
  background:#111;font-family:Arial,sans-serif;perspective:1200px;
}
#bg{
  position:fixed;inset:-20%;
  background:linear-gradient(90deg,#ff3b8d,#7b5cff,#00d4ff);
  filter:blur(45px);opacity:.65;
  transition:transform .05s linear;
}
.card{
  width:82vw;max-width:390px;height:72vh;max-height:700px;
  position:relative;z-index:1;overflow:hidden;border-radius:32px;
  box-shadow:0 30px 80px rgba(0,0,0,.6);
  transform-style:preserve-3d;
}
.card img{
  width:100%;height:100%;object-fit:cover;display:block;
  transform:scale(1.08);
}
#overlay{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,#ff0055,transparent 50%,#00cfff);
  mix-blend-mode:color;opacity:.45;
}
#shine{
  position:absolute;inset:-80%;pointer-events:none;
  background:linear-gradient(110deg,transparent 43%,rgba(255,255,255,.65) 50%,transparent 57%);
  mix-blend-mode:screen;
}
#status{
  position:fixed;top:20px;left:50%;transform:translateX(-50%);
  z-index:5;color:white;background:rgba(0,0,0,.45);
  padding:8px 14px;border-radius:20px;font-size:13px;
}
button{
  position:fixed;bottom:35px;z-index:10;border:0;border-radius:30px;
  padding:16px 25px;font-size:16px;color:#fff;
  background:rgba(0,0,0,.75);backdrop-filter:blur(15px);
}
</style>
</head>
<body>

<div id="bg"></div>
<div id="status">Nhấn nút để bật cảm biến</div>

<div class="card" id="card">
  <!-- Bạn có thể thay URL này bằng ảnh của mình -->
  <img id="photo" src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=1200&q=90">
  <div id="overlay"></div>
  <div id="shine"></div>
</div>

<button id="start">Bật hiệu ứng nghiêng</button>

<script>
const card=document.getElementById('card');
const photo=document.getElementById('photo');
const overlay=document.getElementById('overlay');
const shine=document.getElementById('shine');
const bg=document.getElementById('bg');
const status=document.getElementById('status');
const start=document.getElementById('start');

let targetGamma=0,targetBeta=0,gamma=0,beta=0;
let active=false;

function clamp(v,min,max){return Math.max(min,Math.min(max,v));}

function loop(){
  gamma+=(targetGamma-gamma)*0.12;
  beta+=(targetBeta-beta)*0.12;

  card.style.transform=`rotateY(${gamma*0.9}deg) rotateX(${-beta*0.35}deg)`;
  photo.style.transform=`scale(1.08) translateX(${-gamma*0.8}px)`;
  photo.style.filter=`hue-rotate(${gamma*5}deg) saturate(${1.1+Math.abs(gamma)/35})`;
  overlay.style.opacity=clamp(0.25+Math.abs(gamma)/45,0.25,0.9);
  shine.style.transform=`translateX(${gamma*4}%)`;
  bg.style.transform=`translateX(${gamma*3}px)`;
  requestAnimationFrame(loop);
}
loop();

function enableMotion(){
  active=true;
  window.addEventListener('deviceorientation', e=>{
    targetGamma=clamp(e.gamma||0,-30,30);
    targetBeta=clamp(e.beta||0,-30,30);
    status.textContent=`Cảm biến hoạt động • Nghiêng: ${Math.round(targetGamma)}°`;
  }, true);
  start.style.display='none';
}

start.addEventListener('click', async ()=>{
  try{
    if(typeof DeviceOrientationEvent!=='undefined' &&
       typeof DeviceOrientationEvent.requestPermission==='function'){
      const permission=await DeviceOrientationEvent.requestPermission();
      if(permission==='granted') enableMotion();
      else status.textContent='Bạn chưa cho phép cảm biến';
    }else{
      enableMotion();
    }
  }catch(err){
    status.textContent='Lỗi: '+err.message;
  }
});
</script>
</body>
</html>
